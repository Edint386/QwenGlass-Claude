# 加进你自己 HTTPS 站点的配置，挂在 /claude/ 下面，不用新开域名和证书。
# upstream 放在 server 块外面，location 放进 server 块。WebSocket 一连就是几十分钟，所以超时给到一小时。
upstream glassclaude_cloud {
    server 127.0.0.1:8790 max_fails=0;
    keepalive 8;
    keepalive_timeout 3600s;
}

    location = /claude/healthz {
        proxy_pass http://glassclaude_cloud/healthz;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    # 平台连进来的 WebSocket
    location = /claude/agent {
        proxy_pass http://glassclaude_cloud/agent;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Request-Id $http_x_request_id;
        proxy_connect_timeout 3s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    # Mac 上的桥接程序连进来的 WebSocket
    location = /claude/bridge {
        proxy_pass http://glassclaude_cloud/bridge;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 3s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }
